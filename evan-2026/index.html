<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evan is turning 7!</title>
<meta name="description" content="You're invited to Evan's 7th birthday at Bricks & Minifigs Portland, 3040 NE Sandy Blvd. Build your minifig and walk it to the party.">
<meta property="og:title" content="Evan is turning 7! 🧱">
<meta property="og:description" content="Build your minifig and walk it to the party at Bricks & Minifigs Portland (3040 NE Sandy Blvd), Sunday, November 1, 3:00–4:30pm.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffd92e; --ink:#17203a; --panel:#fffdf3; --red:#e2231a; --blue:#1463d8; --btn:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17203a; --ink:#fff6cf; --panel:#222d4d; --btn:#2e3b63; }
}
:root[data-theme="dark"]{ --bg:#17203a; --ink:#fff6cf; --panel:#222d4d; --btn:#2e3b63; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto}
#app{width:100%;max-width:980px;height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(18px,4.5vw,30px);margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.1}
#name{font:inherit;font-weight:600;font-size:17px;padding:8px 14px;border-radius:999px;border:3px solid var(--ink);
  background:var(--panel);color:var(--ink);width:min(100%,220px);flex:1 1 180px;max-width:260px}
@media (max-width:520px){#name{max-width:none}}
#stage{position:relative;flex:1;min-height:330px;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:#8fd3ff;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,#name:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.arw{position:absolute;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:3px solid #17203a;background:#fff;color:#17203a;
  font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 #17203a;padding:0}
.arw:active{transform:translateY(3px);box-shadow:none}
.arw.l{left:10px}.arw.r{right:10px}
.cap{position:absolute;right:58px;margin-top:-11px;font-size:13px;font-weight:600;background:#17203a;color:#fff;padding:2px 9px;border-radius:999px;pointer-events:none;opacity:.85}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#17203a;color:#fff;padding:6px 16px;border-radius:999px;
  font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.away .arw,.away .cap{display:none}
@media (max-width:520px){.cap{display:none}.arw.l{left:6px}.arw.r{right:6px}}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bg{display:flex;align-items:center;gap:6px;flex:1 1 220px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:4px}
#bg button{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);font-size:16px;font-weight:700}
#bgname{flex:1;text-align:center;font-weight:600;font-size:16px}
.big{border:3px solid var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:17px;background:var(--btn);box-shadow:0 4px 0 var(--ink)}
.big:disabled{opacity:.45}
.big:active{transform:translateY(4px);box-shadow:none}
#go{background:var(--red);color:#fff;flex:1 1 180px}
#ttl{flex:1 1 320px;min-width:0}
#intro{margin:2px 0 0;font-size:clamp(13.5px,2.2vw,16px);line-height:1.3;max-width:62ch}
#info{margin:4px 0 0;font-size:clamp(13.5px,2.2vw,16px);line-height:1.3;font-weight:600}
#info a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#rsf .cal{display:flex;gap:8px;margin-top:12px}
#rsf .cal a{flex:1;text-align:center;text-decoration:none;color:#17203a;background:#ffd92e;border-color:#17203a;box-shadow:0 4px 0 #17203a;font-size:15px;padding:10px 8px}
#pbar{display:none;gap:10px;flex-wrap:wrap}
#pbar .big{flex:1 1 150px;text-align:center;text-decoration:none;font-size:16px}
#rsvp{background:var(--red);color:#fff}
#rs{position:fixed;inset:0;z-index:20;background:rgba(23,32,58,.6);display:none;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px))}
#rs.on{display:flex}
#rsf{position:relative;width:100%;max-width:440px;max-height:100%;overflow:auto;background:#fffdf3;color:#17203a;border:4px solid #17203a;border-radius:20px;padding:16px 18px 18px}
#rsf h2{margin:0;font-size:24px}
#rsf .sub{margin:2px 0 10px;font-size:14.5px}
#rsf label{display:block;font-weight:600;font-size:15px;margin:10px 0 0}
#rsf em{font-weight:400;font-style:normal;opacity:.75}
#rsf input:not([type=radio]),#rsf textarea{display:block;width:100%;margin-top:4px;font:inherit;font-weight:400;font-size:16px;padding:9px 12px;border:3px solid #17203a;border-radius:12px;background:#fff;color:#17203a}
#rsf textarea{resize:vertical}
#rsf fieldset{border:0;padding:0;margin:10px 0 0}
#rsf legend{font-weight:600;font-size:15px;padding:0}
.yn{display:flex;gap:8px;margin-top:4px}
.yn label{flex:1;margin:0!important}
.yn input{position:absolute;opacity:0}
.yn span{display:block;text-align:center;padding:9px 6px;border:3px solid #17203a;border-radius:999px;background:#fff;cursor:pointer}
.yn input:checked+span{background:#ffd92e}
.yn input:focus-visible+span{outline:3px solid #1463d8;outline-offset:2px}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px}
#rsf .send{width:100%;margin-top:14px;background:#e2231a;color:#fff;border-color:#17203a;box-shadow:0 4px 0 #17203a}
#rsf .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:3px solid #17203a;background:#fff;font-size:15px;font-weight:700;color:#17203a}
#rsf .err{color:#c11a13;font-size:14px;margin:8px 0 0;min-height:0}
#rsf .done{font-size:18px;font-weight:600;margin:12px 0 0}
#link{flex:1 1 100%;font:inherit;font-size:13px;padding:8px;border:3px solid var(--ink);border-radius:12px;display:none;background:var(--panel);color:var(--ink)}
.party #bar{display:none}.party #pbar{display:flex}

</style>
</head>
<body>
<div id="app">
  <header>
    <div id="ttl"><h1 id="h1"></h1><p id="intro"></p><p id="info"></p></div>
    <label for="name" class="sr">Your name</label>
    <input id="name" maxlength="20" placeholder="Your name" autocomplete="off">
  </header>
  <div id="stage">
    <canvas id="c" aria-label="3D minifigure. Drag to spin."></canvas>
    <div id="toast">Drag to spin</div>
    </div>
  <div id="bar">
    <div id="bg">
      <button id="bgl" aria-label="Previous background">◀</button>
      <span id="bgname"></span>
      <button id="bgr" aria-label="Next background">▶</button>
    </div>
    <button class="big" id="rand" aria-label="Surprise me">🎲</button>
    <button class="big" id="go">Walk to the party 🎉</button>
  </div>
  <div id="pbar">
    <button class="big" id="again">Change my outfit</button>
    <button class="big" id="share">Copy my link</button>
    <button class="big" id="rsvp">RSVP</button>
    <input id="link" readonly aria-label="Your link">
  </div>
  <div id="rs" role="dialog" aria-modal="true" aria-labelledby="rsh">
    <form id="rsf" novalidate>
      <button type="button" class="x" id="rsx" aria-label="Close">✕</button>
      <h2 id="rsh">RSVP</h2>
      <p class="sub" id="rssub"></p>
      <div id="rsfields">
        <label>Your name<input name="kid" id="rskid" required maxlength="40" autocomplete="off"></label>
        <fieldset><legend>Can you come?</legend>
          <div class="yn"><label><input type="radio" name="coming" value="yes" required><span>Yes! 🎉</span></label><label><input type="radio" name="coming" value="no"><span>Can't make it</span></label></div>
        </fieldset>
        <p class="err" id="rserr" role="alert"></p>
        <button class="big send" type="submit" id="rssend">Send RSVP</button>
      </div>
      <div id="rsdone" hidden><p class="done" id="rsdmsg"></p><div class="cal" id="rscal" hidden><a class="big" id="calics" href="evan.ics" download="evan-birthday.ics">📅 Add to calendar</a><a class="big" id="calg" target="_blank" rel="noopener">Google Calendar</a></div><button type="button" class="big send" id="rsok">Back to the party</button></div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====== EDIT THE PARTY DETAILS HERE ====== */
const PARTY = {
  kid:    "Evan",
  age:    7,
  when:   "Sunday, November 1 · 3:00–4:30pm",
  venue:  "Bricks & Minifigs Portland",
  address:"3040 NE Sandy Blvd, Portland, OR",
  dropoff:"Drop off at 3, pick up at 4:30 sharp.",
  gifts:  "",   // e.g. "No gifts needed!" (left blank = not shown)
  // Event times in UTC for calendar links (Nov 1 2026 is PST, UTC-8).
  start:  "20261101T230000Z",
  end:    "20261102T003000Z",
  // RSVP goes to this Google Form. The entry IDs come from the form's "Get pre-filled link".
  rsvpForm: {
    action:    "https://docs.google.com/forms/d/e/1FAIpQLScWdVTxrv2ONmg-3xdBmBvnEjP2EpRpocO7uk_yO7SAw32wrQ/formResponse",
    name:      "entry.442800742",
    attending: "entry.15622378",
    url:       "entry.1298075914"
  },
  sign:   "BRICKS & MINIFIGS"
};
/* ========================================= */

const T=THREE, $=id=>document.getElementById(id);
const stage=$('stage'), canvas=$('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new T.Scene(); scene.background=new T.Color(0x8fd3ff);
const cam=new T.PerspectiveCamera(40,1,0.1,300);
scene.add(new T.HemisphereLight(0xffffff,0xb0b8c8,0.72));
const sun=new T.DirectionalLight(0xffffff,0.42); sun.position.set(5,9,12); scene.add(sun);

const mat=(c,o)=>new T.MeshPhongMaterial(Object.assign({color:c,shininess:70},o||{}));
function add(g,geo,m,x,y,z){const me=new T.Mesh(geo,typeof m==='number'?mat(m):m);me.position.set(x||0,y||0,z||0);g.add(me);return me}
function tex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new T.CanvasTexture(cv);return t}
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fill()}
const fillAll=(c,w,h,col)=>{c.fillStyle=col;c.fillRect(0,0,w,h)};

/* ---------- patterns ---------- */
const P={
  cow(c,w,h){fillAll(c,w,h,'#fff');c.fillStyle='#1a1a1a';const r=rng(7);for(let i=0;i<7;i++){c.beginPath();c.ellipse(r()*w,r()*h,w*(.08+r()*.1),h*(.06+r()*.08),r()*3,0,7);c.fill()}},
  tiger(c,w,h){fillAll(c,w,h,'#f58a1f');c.fillStyle='#1a1a1a';for(let i=0;i<6;i++){const y=h*.08+i*h/6;
    c.beginPath();c.moveTo(0,y-h*.04);c.lineTo(w*.4,y+h*.03);c.lineTo(0,y+h*.05);c.fill();
    c.beginPath();c.moveTo(w,y+h*.04);c.lineTo(w*.6,y+h*.11);c.lineTo(w,y+h*.13);c.fill()}},
  leopard(c,w,h){fillAll(c,w,h,'#e0a94a');const r=rng(3);for(let i=0;i<24;i++){const x=r()*w,y=r()*h,q=w*(.035+r()*.02);
    c.fillStyle='#b8742a';c.beginPath();c.arc(x,y,q*.6,0,7);c.fill();
    c.strokeStyle='#4a2c12';c.lineWidth=w*.022;c.beginPath();const a=r()*6;c.arc(x,y,q,a,a+4.4);c.stroke()}},
  dots(c,w,h,bg){fillAll(c,w,h,bg);const cols=['#e2231a','#1463d8','#19a34a','#ff8a00','#b03fd6'],r=rng(11);
    for(let i=0;i<16;i++){c.fillStyle=cols[i%5];c.beginPath();c.arc(r()*w,r()*h,w*.05,0,7);c.fill()}},
  stars(c,w,h,bg){fillAll(c,w,h,bg);c.fillStyle='#ffd92e';const r=rng(5);for(let i=0;i<11;i++)star(c,r()*w,r()*h,w*(.04+r()*.04))},
  flowers(c,w,h,bg){fillAll(c,w,h,bg);const r=rng(9),cols=['#ff5fa2','#ffd92e','#fff'];for(let i=0;i<9;i++){const x=r()*w,y=r()*h;c.fillStyle=cols[i%3];
    for(let k=0;k<5;k++){c.beginPath();c.arc(x+Math.cos(k*1.257)*w*.05,y+Math.sin(k*1.257)*w*.05,w*.04,0,7);c.fill()}
    c.fillStyle='#ff8a00';c.beginPath();c.arc(x,y,w*.03,0,7);c.fill()}}
};

/* ---------- faces (1024x256, centre x=512) ---------- */
const SKIN='#ffcf00';
function eyes(c,dy){c.fillStyle='#111';[-56,56].forEach(d=>{c.beginPath();c.arc(512+d,105+(dy||0),13,0,7);c.fill()});
  c.fillStyle='#fff';[-56,56].forEach(d=>{c.beginPath();c.arc(516+d,100+(dy||0),4,0,7);c.fill()})}
function smile(c,r,y){c.strokeStyle='#111';c.lineWidth=9;c.lineCap='round';c.beginPath();c.arc(512,y||125,r||62,.2*Math.PI,.8*Math.PI);c.stroke()}
const FACES=[
  {n:'Smile',d(c){eyes(c);smile(c)}},
  {n:'Big grin',d(c){eyes(c);c.fillStyle='#111';c.beginPath();c.arc(512,150,58,0,Math.PI);c.fill();c.fillStyle='#fff';c.fillRect(466,150,92,14);c.fillStyle='#e2231a';c.beginPath();c.arc(512,196,22,Math.PI,0);c.fill()}},
  {n:'Cool shades',d(c){c.fillStyle='#111';c.fillRect(430,84,70,42);c.fillRect(524,84,70,42);c.fillRect(420,90,190,10);c.strokeStyle='#111';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(480,180);c.quadraticCurveTo(530,200,560,168);c.stroke()}},
  {n:'Wink',d(c){c.fillStyle='#111';c.beginPath();c.arc(456,105,13,0,7);c.fill();c.strokeStyle='#111';c.lineWidth=8;c.lineCap='round';c.beginPath();c.arc(568,112,15,1.15*Math.PI,1.85*Math.PI);c.stroke();smile(c)}},
  {n:'Surprised',d(c){eyes(c,-6);c.strokeStyle='#111';c.lineWidth=6;c.beginPath();c.arc(456,70,22,1.2*Math.PI,1.8*Math.PI);c.stroke();c.beginPath();c.arc(568,70,22,1.2*Math.PI,1.8*Math.PI);c.stroke();c.fillStyle='#111';c.beginPath();c.ellipse(512,178,22,28,0,0,7);c.fill()}},
  {n:'Beard',d(c){c.fillStyle='#6b3f1d';c.beginPath();c.moveTo(400,130);c.quadraticCurveTo(512,170,624,130);c.lineTo(624,256);c.lineTo(400,256);c.fill();eyes(c);c.strokeStyle='#fff';c.lineWidth=8;c.lineCap='round';c.beginPath();c.arc(512,150,40,.25*Math.PI,.75*Math.PI);c.stroke()}},
  {n:'Mustache',d(c){eyes(c);c.fillStyle='#2b1a10';c.beginPath();c.ellipse(478,158,40,15,-.25,0,7);c.fill();c.beginPath();c.ellipse(546,158,40,15,.25,0,7);c.fill();smile(c,40,150)}},
  {n:'Clown',d(c){c.fillStyle='#1463d8';[-56,56].forEach(d=>star(c,512+d,102,30));eyes(c);c.fillStyle='#fff';c.beginPath();c.ellipse(512,185,80,36,0,0,7);c.fill();c.strokeStyle='#e2231a';c.lineWidth=12;c.lineCap='round';c.beginPath();c.arc(512,150,58,.2*Math.PI,.8*Math.PI);c.stroke();c.fillStyle='#e2231a';c.beginPath();c.arc(512,138,20,0,7);c.fill()}},
  {n:'Eye patch',d(c){c.strokeStyle='#111';c.lineWidth=7;c.beginPath();c.moveTo(0,60);c.lineTo(1024,130);c.stroke();c.fillStyle='#111';c.beginPath();c.ellipse(568,105,28,24,0,0,7);c.fill();c.beginPath();c.arc(456,105,13,0,7);c.fill();c.fillStyle='#8a8a8a';for(let i=0;i<30;i++)c.fillRect(420+((i*37)%190),150+((i*53)%80),4,4);smile(c,50,128)}},
  {n:'Whiskers',d(c){eyes(c);c.fillStyle='#ff5fa2';c.beginPath();c.moveTo(498,138);c.lineTo(526,138);c.lineTo(512,154);c.fill();c.strokeStyle='#111';c.lineWidth=5;c.lineCap='round';
    [-1,1].forEach(s=>[-14,0,14].forEach(o=>{c.beginPath();c.moveTo(512+s*30,160);c.lineTo(512+s*100,160+o);c.stroke()}));c.beginPath();c.arc(497,158,15,0,Math.PI);c.stroke();c.beginPath();c.arc(527,158,15,0,Math.PI);c.stroke()}},
  {n:'Grumpy',d(c){eyes(c,6);c.strokeStyle='#111';c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(430,72);c.lineTo(486,90);c.moveTo(594,72);c.lineTo(538,90);c.stroke();c.beginPath();c.arc(512,220,55,1.25*Math.PI,1.75*Math.PI);c.stroke()}},
  {n:'Freckles',d(c){eyes(c);c.strokeStyle='#111';c.lineWidth=5;c.lineCap='round';[-1,1].forEach(s=>{c.beginPath();c.moveTo(512+s*68,90);c.lineTo(512+s*84,78);c.moveTo(512+s*60,86);c.lineTo(512+s*68,72);c.stroke()});
    c.fillStyle='#c97a00';[[-80,140],[-64,150],[-90,156],[80,140],[64,150],[90,156]].forEach(p=>{c.beginPath();c.arc(512+p[0],p[1],5,0,7);c.fill()});smile(c)}},
  {n:'Safety goggles',d(c){R(c,'#3a4252',0,96,1024,18);[-56,56].forEach(d=>{c.fillStyle='#d8f3ff';c.strokeStyle='#3a4252';c.lineWidth=9;c.beginPath();c.arc(512+d,105,38,0,7);c.fill();c.stroke()});eyes(c);
    c.fillStyle='#111';c.beginPath();c.arc(512,165,46,0,Math.PI);c.fill();c.fillStyle='#fff';c.fillRect(476,165,72,12)}},
  {n:'Normal',d(c){eyes(c);c.strokeStyle='#111';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(472,165);c.lineTo(552,165);c.stroke()}},
];

/* ---------- shirts (256x256 front) ---------- */
const R=(c,col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
const tri=(c,col,a,b,d)=>{c.fillStyle=col;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(d[0],d[1]);c.fill()};
const SHIRTS=[

    if(tMode>.6){fig.rotation.y=0;legL.rotation.x=legR.rotation.x=0;setMode('party');arrive()}}
  else if(mode==='party'){partyCam();if(!drag){fig.rotation.y+=spinV;spinV*=.93;
      if(Math.abs(spinV)<.01&&dancePose(tMode,now).move!=='spin'){const tg=Math.round(fig.rotation.y/(2*Math.PI))*2*Math.PI;fig.rotation.y+=(tg-fig.rotation.y)*Math.min(1,dt*4)}}
    {const d=dancePose(tMode,now);aL=d.aL;aR=d.aR;zL=d.zL;zR=d.zR;hd=d.hd;sw=d.sw;
      const lf=Math.min(1,dt*10);fig.position.y+=(d.y-fig.position.y)*lf;fig.position.x+=(STOP_X+d.x-fig.position.x)*lf;
      legL.rotation.x+=(d.lL-legL.rotation.x)*lf;legR.rotation.x+=(d.lR-legR.rotation.x)*lf;
      if(d.move==='spin'){const u0=(tMode-dt)%MOVE_T/MOVE_T,u1=tMode%MOVE_T/MOVE_T;if(u1>u0)fig.rotation.y+=(smooth(u1)-smooth(u0))*Math.PI*2}}
    confetti.forEach(m=>{if(!m.visible)return;m.position.y-=m.v*dt;m.rotation.x+=dt*m.s;m.rotation.z+=dt*m.s*.7;if(m.position.y<0)m.position.y=14})}
  armL.rotation.x+=(aL-armL.rotation.x)*Math.min(1,dt*12);armR.rotation.x+=(aR-armR.rotation.x)*Math.min(1,dt*12);
  {const f=Math.min(1,dt*10);armL.rotation.z+=(zL-armL.rotation.z)*f;armR.rotation.z+=(zR-armR.rotation.z)*f;
   head.rotation.y+=(Math.PI+hd-head.rotation.y)*f;hatG.rotation.y=head.rotation.y-Math.PI;fig.rotation.z+=(sw-fig.rotation.z)*f}
  balloons.forEach(b=>{b.rotation.z=Math.sin(now*1.5+b.ph)*.06});
  const f=Math.min(1,dt*(mode==='walk'?6:3));camX+=(tgtX-camX)*f;camK+=(tgtK-camK)*f;lookY+=(tgtLook-lookY)*f;placeCam();
  shadow.position.x=fig.position.x;shadow.scale.setScalar(1-fig.position.y*.6);
  renderer.render(scene,cam)}
